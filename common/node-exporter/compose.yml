services:
  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: infra-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)"
      - "--collector.netdev.device-exclude=^(veth.*|docker.*|br-.*|lo)$$"
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 10s
      timeout: 5s
      retries: 5
