include:
  - ../common/node-exporter/compose.yml

services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.0-ce.0
    container_name: infra-gitlab
    hostname: gitlab.lab.emptyvessel-playground.ru
    restart: unless-stopped
    shm_size: "256m"
    ports:
      - "80:80"
      - "5050:5050"
      - "2222:22"
    volumes:
      - infra-gitlab-config:/etc/gitlab
      - infra-gitlab-logs:/var/log/gitlab
      - infra-gitlab-data:/var/opt/gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.lab.emptyvessel-playground.ru'
        letsencrypt['enable'] = false
        nginx['listen_https'] = false
        nginx['listen_port'] = 80
        nginx['real_ip_trusted_addresses'] = ['10.20.0.2']
        nginx['real_ip_header'] = 'X-Real-IP'
        gitlab_rails['trusted_proxies'] = ['10.20.0.2']
        prometheus_monitoring['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        registry_external_url 'https://registry.lab.emptyvessel-playground.ru'
        registry_nginx['listen_https'] = false
        registry_nginx['listen_port'] = 5050
        registry_nginx['real_ip_trusted_addresses'] = ['10.20.0.2']
        registry_nginx['real_ip_header'] = 'X-Real-IP'

volumes:
  infra-gitlab-config:
    name: infra-gitlab-config
  infra-gitlab-logs:
    name: infra-gitlab-logs
  infra-gitlab-data:
    name: infra-gitlab-data
