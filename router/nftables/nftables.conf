#!/usr/sbin/nft -f

flush ruleset

table ip filter {
	chain INPUT {
		type filter hook input priority filter; policy drop;
		iifname "lo" accept
		ct state invalid drop
		ct state established,related accept
		icmp type echo-request limit rate 100/second burst 20 packets accept
		udp sport 67 udp dport 68 accept
		iifname "enp5s0" tcp dport 22 counter accept
		tcp dport { 80, 443 } counter accept
	}

	chain FORWARD {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		iifname "enp6s0" ip saddr 10.20.0.0/24 oifname "enp5s0" counter accept
	}
}
table ip nat {
	chain POSTROUTING {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "enp5s0" ip saddr 10.20.0.0/24 counter masquerade
	}
}
